        <!-- Bottom Mobile Navigation Bar -->
        <nav class="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-stone-900 border-t border-stone-800 z-30 px-2 py-2 grid grid-cols-4 gap-1">
            <button onclick="switchTab('tab-pos')" id="nav-tab-pos" class="nav-item flex flex-col items-center justify-center text-amber-400 font-bold py-1">
                <i class="fa-solid fa-cash-register text-base mb-0.5"></i>
                <span class="text-[10px]">Ventas</span>
            </button>
            <button onclick="switchTab('tab-gastos')" id="nav-tab-gastos" class="nav-item flex flex-col items-center justify-center text-stone-400 font-semibold py-1">
                <i class="fa-solid fa-receipt text-base mb-0.5"></i>
                <span class="text-[10px]">Gastos</span>
            </button>
            <button onclick="switchTab('tab-precios')" id="nav-tab-precios" class="nav-item flex flex-col items-center justify-center text-stone-400 font-semibold py-1">
                <i class="fa-solid fa-book-bookmark text-base mb-0.5"></i>
                <span class="text-[10px]">Notas Precios</span>
            </button>
            <button onclick="switchTab('tab-dashboard')" id="nav-tab-dashboard" class="nav-item flex flex-col items-center justify-center text-stone-400 font-semibold py-1">
                <i class="fa-solid fa-chart-pie text-base mb-0.5"></i>
                <span class="text-[10px]">Utilidad</span>
            </button>
        </nav>

    </div>

    <script>
        // --- BASE DE DATOS Y PRECIOS DEL USUARIO ---
        const PRECONFIGURED_PRODUCTS = [
            { id: 'dogo_sencillo', name: 'Dogo Sencillo', price: 30, cat: 'dogos', icon: 'fa-hotdog', desc: 'Dogo tradicional' },
            { id: 'dogo_guisado', name: 'Dogo c/ Guisado', price: 35, cat: 'dogos', icon: 'fa-hotdog', desc: 'Con guisado casero' },
            { id: 'dogo_orden_3', name: 'Orden 3 Dogos Sencillos', price: 75, cat: 'dogos', icon: 'fa-layer-group', desc: 'Paquete de 3 dogos' },
            { id: 'dogo_orden_3_guisado', name: 'Orden 3 Dogos c/ Guisado', price: 90, cat: 'dogos', icon: 'fa-layer-group', desc: 'Paquete 3 dogos con guisado' },
            { id: 'burger_sencilla', name: 'Hamburguesa Sencilla', price: 60, cat: 'burgers', icon: 'fa-burger', desc: 'Carne jugosa tradicional' },
            { id: 'burger_papas', name: 'Hamburguesa c/ Papas', price: 80, cat: 'burgers', icon: 'fa-burger', desc: 'Incluye papas a la francesa' },
            { id: 'burger_salchicha', name: 'Hamburguesa c/ Salchicha', price: 100, cat: 'burgers', icon: 'fa-burger', desc: 'Con salchicha asada' },
            { id: 'burger_especial', name: 'Hamburguesa Especial', price: 110, cat: 'burgers', icon: 'fa-crown', desc: 'Aderezo de casa + salchicha' }
        ];

        // Estado Global de la App almacenado localmente
        let appData = {
            currentWeek: 1,
            cart: [],
            sales: [],
            expenses: [],
            priceNotes: [
                { id: 'pn1', item: 'Pan para Dogos', store: "Sam's Club", price: 52.00, unit: 'Paquete 12 pzas', obs: 'Excelente calidad y suave' },
                { id: 'pn2', item: 'Tocino Ahumado 1kg', store: "Carnicería San José", price: 165.00, unit: '1 kg', obs: 'Buen grosor de tira' }
            ]
        };

        let financialChartInstance = null;

        // --- INICIALIZACIÓN ---
        window.onload = function() {
            loadFromLocalStorage();
            renderProductsGrid('todos');
            updateCartBar();
            renderExpenses();
            renderPriceNotes();
            renderDashboard();
            initChart();
        };

        // --- PERSISTENCIA EN LOCALSTORAGE ---
        function saveToLocalStorage() {
            localStorage.setItem('los_inges_data_v1', JSON.stringify(appData));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('los_inges_data_v1');
            if (saved) {
                try {
                    appData = JSON.parse(saved);
                    if (!appData.priceNotes) appData.priceNotes = [];
                    const weekTag = document.getElementById('currentWeekTag');
                    if (weekTag) weekTag.innerText = `Semana ${appData.currentWeek || 1}`;
                } catch(e) {
                    console.error('Error al cargar datos locales', e);
                }
            }
        }

        // --- NAVEGACIÓN Y TABS ---
        function switchTab(tabId) {
            document.querySelectorAll('main > section').forEach(sec => sec.classList.add('hidden'));
            const targetSection = document.getElementById(tabId);
            if (targetSection) targetSection.classList.remove('hidden');

            // Actualizar estado botones nav inferior
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.remove('text-amber-400', 'font-bold');
                btn.classList.add('text-stone-400', 'font-semibold');
            });

            const activeBtn = document.getElementById(`nav-${tabId}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-stone-400', 'font-semibold');
                activeBtn.classList.add('text-amber-400', 'font-bold');
            }

            // Ocultar barra flotante de carrito si no es la pestaña POS
            const cartBar = document.getElementById('cartStickyBar');
            if (cartBar) {
                if (tabId === 'tab-pos' && appData.cart.length > 0) {
                    cartBar.classList.remove('hidden');
                } else {
                    cartBar.classList.add('hidden');
                }
            }

            if (tabId === 'tab-dashboard') {
                renderDashboard();
            }
        }

        // --- POS & PRODUCTOS ---
        function renderProductsGrid(category = 'todos') {
            const grid = document.getElementById('productsGrid');
            if (!grid) return;
            grid.innerHTML = '';

            const filtered = category === 'todos' 
                ? PRECONFIGURED_PRODUCTS 
                : PRECONFIGURED_PRODUCTS.filter(p => p.cat === category);

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-white p-3 rounded-2xl border border-stone-200 shadow-sm flex flex-col justify-between hover:border-amber-400 transition-all cursor-pointer active:scale-95 touch-active";
                card.onclick = () => addToCart(p);
                card.innerHTML = `
                    <div class="space-y-1">
                        <div class="flex items-center justify-between">
                            <span class="w-7 h-7 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center text-xs">
                                <i class="fa-solid ${p.icon}"></i>
                            </span>
                            <span class="font-extrabold text-stone-900 text-sm">$${p.price}</span>
                        </div>
                        <h3 class="font-bold text-stone-800 text-xs leading-snug pt-1">${p.name}</h3>
                        <p class="text-[10px] text-stone-400 leading-tight">${p.desc}</p>
                    </div>
                    <button class="mt-3 w-full bg-stone-900 hover:bg-amber-500 hover:text-stone-950 text-white font-bold text-[11px] py-1.5 rounded-xl transition-colors flex items-center justify-center gap-1">
                        <i class="fa-solid fa-plus text-[9px]"></i> Agregar
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.remove('bg-amber-500', 'text-stone-950', 'font-bold');
                b.classList.add('bg-stone-100', 'text-stone-600');
            });
            event.target.classList.remove('bg-stone-100', 'text-stone-600');
            event.target.classList.add('bg-amber-500', 'text-stone-950', 'font-bold');
            renderProductsGrid(cat);
        }

        // --- CARRITO DE COMPRAS ---
        function addToCart(product) {
            const existing = appData.cart.find(item => item.id === product.id);
            if (existing) {
                existing.qty++;
            } else {
                appData.cart.push({ ...product, qty: 1 });
            }
            updateCartBar();
        }

        function updateCartBar() {
            const totalQty = appData.cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = appData.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const cartBar = document.getElementById('cartStickyBar');
            const cartCount = document.getElementById('cartTotalCount');
            const cartPrice = document.getElementById('cartTotalPrice');

            if (cartCount) cartCount.innerText = totalQty;
            if (cartPrice) cartPrice.innerText = `$${totalPrice.toFixed(2)}`;

            if (cartBar) {
                if (totalQty > 0) {
                    cartBar.classList.remove('hidden');
                } else {
                    cartBar.classList.add('hidden');
                }
            }
        }

        // --- GASTOS ---
        function renderExpenses() {
            const list = document.getElementById('expensesList');
            if (!list) return;
            list.innerHTML = '';

            if (!appData.expenses || appData.expenses.length === 0) {
                list.innerHTML = `<p class="text-stone-400 text-xs text-center py-4">No hay gastos registrados en esta semana.</p>`;
                return;
            }

            appData.expenses.forEach(e => {
                const item = document.createElement('div');
                item.className = "bg-stone-50 p-2.5 rounded-xl border border-stone-200 flex justify-between items-center text-xs";
                item.innerHTML = `
                    <div>
                        <span class="font-bold text-stone-800 block">${e.concept}</span>
                        <span class="text-[10px] text-stone-400">${e.category} • ${e.date || ''}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-extrabold text-stone-900">$${parseFloat(e.amount).toFixed(2)}</span>
                        <button onclick="deleteExpense('${e.id}')" class="text-stone-400 hover:text-red-500 text-[11px]"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function deleteExpense(id) {
            appData.expenses = appData.expenses.filter(e => e.id !== id);
            saveToLocalStorage();
            renderExpenses();
            renderDashboard();
        }

        // --- NOTAS DE PRECIOS Y COTIZACIONES ---
        function savePriceNote(e) {
            e.preventDefault();
            const editId = document.getElementById('noteEditId').value;
            const item = document.getElementById('noteItem').value.trim();
            const store = document.getElementById('noteStore').value.trim();
            const price = parseFloat(document.getElementById('notePrice').value);
            const unit = document.getElementById('noteUnit').value.trim() || 'General';
            const obs = document.getElementById('noteObs').value.trim() || '';

            if (!item || !store || isNaN(price)) return;

            if (editId) {
                const note = appData.priceNotes.find(n => n.id === editId);
                if (note) {
                    note.item = item;
                    note.store = store;
                    note.price = price;
                    note.unit = unit;
                    note.obs = obs;
                }
            } else {
                appData.priceNotes.unshift({
                    id: 'pn_' + Date.now(),
                    item, store, price, unit, obs
                });
            }

            saveToLocalStorage();
            renderPriceNotes();
            cancelNoteEdit();
        }

        function renderPriceNotes() {
            const list = document.getElementById('priceNotesList');
            if (!list) return;

            const searchInput = document.getElementById('searchPriceNote');
            const search = searchInput ? (searchInput.value || '').toLowerCase() : '';
            list.innerHTML = '';

            const filtered = (appData.priceNotes || []).filter(n => 
                n.item.toLowerCase().includes(search) || 
                n.store.toLowerCase().includes(search)
            );

            if (filtered.length === 0) {
                list.innerHTML = `<p class="text-stone-400 text-xs text-center py-4">No hay notas de precios guardadas.</p>`;
                return;
            }

            filtered.forEach(n => {
                const card = document.createElement('div');
                card.className = "bg-stone-50 p-3 rounded-xl border border-stone-200 text-xs space-y-2";
                card.innerHTML = `
                    <div class="flex justify-between items-start border-b border-stone-200 pb-1.5">
                        <div>
                            <span class="font-extrabold text-stone-900 text-xs block">${n.item}</span>
                            <span class="text-[10px] text-amber-800 font-bold bg-amber-100 px-1.5 py-0.5 rounded">${n.store}</span>
                        </div>
                        <div class="text-right">
                            <span class="text-sm font-black text-stone-900 block">$${parseFloat(n.price).toFixed(2)}</span>
                            <span class="text-[9px] text-stone-400">${n.unit}</span>
                        </div>
                    </div>

                    ${n.obs ? `<p class="text-[10px] text-stone-600 bg-white p-1.5 rounded border border-stone-100"><i class="fa-regular fa-comment-dots text-amber-500 mr-1"></i>${n.obs}</p>` : ''}

                    <div class="flex justify-between items-center pt-1">
                        <button onclick="convertToExpense('${n.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-[10px] px-2.5 py-1 rounded-lg flex items-center gap-1 touch-active shadow-sm">
                            <i class="fa-solid fa-cart-plus"></i> Convertir en Gasto Real
                        </button>

                        <div class="flex items-center gap-2">
                            <button onclick="editPriceNote('${n.id}')" class="text-stone-500 hover:text-stone-800 text-[11px]"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deletePriceNote('${n.id}')" class="text-stone-400 hover:text-red-500 text-[11px]"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function editPriceNote(id) {
            const note = appData.priceNotes.find(n => n.id === id);
            if (!note) return;

            document.getElementById('noteEditId').value = note.id;
            document.getElementById('noteItem').value = note.item;
            document.getElementById('noteStore').value = note.store;
            document.getElementById('notePrice').value = note.price;
            document.getElementById('noteUnit').value = note.unit;
            document.getElementById('noteObs').value = note.obs;

            document.getElementById('btnSaveNote').innerHTML = `<i class="fa-solid fa-pen"></i> Actualizar Nota`;
            document.getElementById('btnCancelNoteEdit').classList.remove('hidden');
        }

        function cancelNoteEdit() {
            document.getElementById('noteEditId').value = '';
            const form = document.getElementById('priceNoteForm');
            if (form) form.reset();
            document.getElementById('btnSaveNote').innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Guardar Nota de Precio`;
            document.getElementById('btnCancelNoteEdit').classList.add('hidden');
        }

        function deletePriceNote(id) {
            appData.priceNotes = appData.priceNotes.filter(n => n.id !== id);
            saveToLocalStorage();
            renderPriceNotes();
        }

        function convertToExpense(noteId) {
            const note = appData.priceNotes.find(n => n.id === noteId);
            if (!note) return;

            const newExpense = {
                id: 'G-' + Date.now().toString().slice(-5),
                concept: `${note.item} (${note.unit})`,
                amount: note.price,
                category: 'Otros',
                store: note.store,
                date: new Date().toLocaleDateString('es-MX', { weekday: 'short', hour: '2-digit', minute: '2-digit' })
            };

            if (!appData.expenses) appData.expenses = [];
            appData.expenses.unshift(newExpense);
            saveToLocalStorage();
            renderExpenses();
            switchTab('tab-gastos');
        }

        // --- DASHBOARD DE UTILIDAD ---
        function renderDashboard() {
            const totalSales = (appData.sales || []).reduce((sum, s) => sum + s.total, 0);
            const totalExpenses = (appData.expenses || []).reduce((sum, e) => sum + parseFloat(e.amount), 0);
            const netProfit = totalSales - totalExpenses;

            const totalSalesEl = document.getElementById('totalSalesVal');
            const totalExpensesEl = document.getElementById('totalExpensesVal');
            const netProfitEl = document.getElementById('netProfitVal');

            if (totalSalesEl) totalSalesEl.innerText = `$${totalSales.toFixed(2)}`;
            if (totalExpensesEl) totalExpensesEl.innerText = `$${totalExpenses.toFixed(2)}`;
            if (netProfitEl) netProfitEl.innerText = `$${netProfit.toFixed(2)}`;

            updateChart(totalSales, totalExpenses);
        }

        function initChart() {
            const ctx = document.getElementById('financialChart');
            if (!ctx) return;

            financialChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Ventas Totales', 'Gastos Insumos'],
                    datasets: [{
                        data: [0, 0],
                        backgroundColor: ['#f59e0b', '#ef4444']
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }

        function updateChart(sales, expenses) {
            if (financialChartInstance) {
                financialChartInstance.data.datasets[0].data = [sales, expenses];
                financialChartInstance.update();
            }
        }
    </script>
